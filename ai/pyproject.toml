[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "avenza-ai"
version = "0.2.0"
description = "Avenza AI/ML layer: parsers, intent, speech providers, read-back, evaluation tools"
requires-python = ">=3.10"
dependencies = ["httpx>=0.25", "websockets>=13"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["avenza_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
